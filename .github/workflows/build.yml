name: Spring Boot CI

on:
  push:
    branches:
      - main
      - feature/github-actions-ci
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_SCHANSHETTY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_SCHANSHETTY }}/ecomproject:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_SCHANSHETTY }}/ecomproject:latest